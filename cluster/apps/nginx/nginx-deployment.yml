apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-texsite
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-texsite
  template:
    metadata:
      labels:
        app: nginx-texsite
    spec:
      containers:
        - name: nginx
          image: 789382030074.dkr.ecr.us-west-1.amazonaws.com/nginx-texsite:latest # {"": "flux-system:nginx-texsite"}
          ports:
            - containerPort: 80
            - containerPort: 8080
