apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- apps-kustomization.yml
- gotk-components.yaml
- gotk-sync.yaml
- infra-kustomization.yml
- monitoring-kustomization.yml
patches:
  - target:
      kind: ServiceAccount
      name: image-reflector-controller
      namespace: flux-system
    patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: image-reflector-controller
        namespace: flux-system
        annotations:
          eks.amazonaws.com/role-arn: arn:aws:iam::789382030074:role/image-reflector-role
