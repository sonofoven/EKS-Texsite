apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: aws-load-balancer-controller
  namespace: flux-system
spec:
  interval: 10m
  chart:
    spec:
      chart: aws-load-balancer-controller
      sourceRef:
        kind: HelmRepository
        name: eks
        namespace: flux-system
      interval: 10m
  targetNamespace: kube-system
  values:
    clusterName: TexSiteCluster
    region: us-west-1
    vpcId: vpc-0f3f587fc327f8c3f
    serviceAccount:
      create: false
      name: aws-load-balancer-controller
